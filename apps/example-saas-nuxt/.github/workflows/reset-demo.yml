name: Reset demo site

# Runs every morning to return the public demo to a clean, seeded state.
on:
  schedule:
    # 07:00 UTC daily. Adjust to your timezone (cron is always UTC).
    - cron: "0 7 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/example-saas-nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run demo reset
        run: pnpm dlx tsx scripts/reset-demo.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MEDIA_CUTOFF: "2026-07-10"

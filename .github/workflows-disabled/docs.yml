name: Documentation contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/core build
      - run: pnpm --dir packages/sdk build
      - run: pnpm --dir packages/knowledge build
      - run: pnpm --dir apps/docs docs:check
      - run: pnpm --dir apps/docs build

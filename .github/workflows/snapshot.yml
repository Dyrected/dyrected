name: PR Snapshot Release

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to snapshot publish'
        required: true
        type: string

concurrency:
  group: snapshot-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Publish Snapshot
    # Trigger if PR has the 'snapshot' label or if manually triggered via workflow_dispatch
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'snapshot')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # Required for npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      - name: Version & Publish Snapshot to npm
        id: publish_snapshot
        run: |
          PR_NUM="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          TAG_NAME="pr-${PR_NUM}"
          
          # Create snapshot version
          pnpm changeset version --snapshot "${TAG_NAME}"
          
          # Publish snapshot to npm under the PR tag
          pnpm changeset publish --tag "${TAG_NAME}" --no-git-tag

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || context.payload.inputs?.pr_number;
            if (!prNumber) return;
            
            const tag = `pr-${prNumber}`;
            const body = `### 🚀 PR Snapshot Released to npm!
            
            You can test this branch in any project without merging:
            
            \`\`\`bash
            # Install core from this branch
            pnpm add @dyrected/core@${tag}
            
            # Or install all related packages
            pnpm add @dyrected/core@${tag} @dyrected/admin@${tag} @dyrected/next@${tag}
            \`\`\`
            
            > *Note: This snapshot is temporary and tagged under \`${tag}\`. It will not affect \`@latest\` users.*`;
            
            // Check for existing comment from previous snapshot runs to avoid spam
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(c => c.body && c.body.includes('PR Snapshot Released to npm!'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

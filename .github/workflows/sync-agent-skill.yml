name: Sync Dyrected agent skill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and verify the skill without opening a pull request
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "packages/knowledge/**"
      - ".github/workflows/sync-agent-skill.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dyrected/knowledge generate:check

      - uses: actions/checkout@v4
        with:
          repository: dyrected/agent-skills
          token: ${{ secrets.AGENT_SKILLS_REPO_TOKEN }}
          path: agent-skills

      - name: Copy generated skill
        run: |
          mkdir -p agent-skills/skills/dyrected
          cp packages/knowledge/generated/SKILL.md agent-skills/skills/dyrected/SKILL.md

      - name: Record originating package version
        run: node -e "const p=require('./packages/knowledge/package.json'); require('fs').writeFileSync('agent-skills/skills/dyrected/VERSION', p.version+'\n')"

      - name: Show dry-run diff
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: agent-skills
        run: git diff --check && git diff

      - name: Open skill update pull request
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AGENT_SKILLS_REPO_TOKEN }}
          path: agent-skills
          branch: automation/dyrected-knowledge-${{ github.sha }}
          delete-branch: true
          commit-message: "chore: sync Dyrected knowledge skill"
          title: "chore: sync Dyrected knowledge skill"
          body: "Generated from @dyrected/knowledge in dyrected/dyrected@${{ github.sha }}. The VERSION file records the originating package version."
